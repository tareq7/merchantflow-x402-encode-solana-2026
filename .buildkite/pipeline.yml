# SellerPilot CI only. No Vercel or Cloudflare production deployments.
# Targets the verified Free-plan Buildkite-hosted Small Linux queue.
steps:
  - label: ":test_tube: SellerPilot tests and production build"
    key: verify
    command: |
      node --version
      npm ci
      npm test
      npm run build
    agents:
      queue: linux-small
