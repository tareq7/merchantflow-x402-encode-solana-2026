name: MerchantFlow x402 V2 test suite
on:
  push:
    branches: [main, feat/x402-v2-mvp, fix/x402-capability-replay-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install x402 service dependencies from committed lockfile
        working-directory: service
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify x402 TypeScript
        working-directory: service
        run: npm run typecheck
      - name: Run x402 V2 middleware and fail-closed tests
        working-directory: service
        run: npm test
      - name: Build service
        working-directory: service
        run: npm run build
      - name: Install inherited dashboard dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run inherited regression tests
        run: npm test
      - name: Build inherited React dashboard
        run: npm run build
